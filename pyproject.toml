[project]
name = "guitar-practice-studio"
version = "0.1.0"
description = "A practice recording, journaling, and review tool for guitarists"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Marco" }
]
keywords = ["guitar", "practice", "music", "recording", "learning"]

dependencies = [
    "dash>=2.14.0",
    "dash-bootstrap-components>=1.5.0",
    "plotly>=5.18.0",
    "sounddevice>=0.4.6",  # For device enumeration
    "soundfile>=0.12.1",   # For waveform generation
    "numpy>=1.26.0",
    "opencv-python>=4.8.0",  # For camera detection
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
# librosa requires numba which has strict Python version requirements
# Install with: uv sync --extra audio-effects
audio-effects = [
    "librosa>=0.10.2",
    "numba>=0.60.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
guitar-practice = "guitar_practice_studio.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guitar_practice_studio"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
