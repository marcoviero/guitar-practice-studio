# Guitar Practice Studio - Exercise Configuration
# Edit this file to customize your practice exercises

[categories]
# Target minutes per category per day (for progress indicators)
[categories.technique]
name = "Technique"
target_minutes = 15
color = "#28a745"  # Green when complete

[categories.chord_perfect]
name = "Chord Perfect"
target_minutes = 10
color = "#28a745"

[categories.songs]
name = "Songs"
target_minutes = 20
color = "#28a745"
# Note: Songs pull from Repertoire tab - exercises here are practice types

[categories.ear_training]
name = "Ear Training"
target_minutes = 10
color = "#28a745"

[categories.theory]
name = "Theory"
target_minutes = 10
color = "#28a745"

[categories.transcribing]
name = "Transcribing"
target_minutes = 15
color = "#28a745"


# ============================================================================
# EXERCISES BY CATEGORY
# ============================================================================

[[exercises]]
