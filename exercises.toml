# Guitar Practice Studio - Exercise Configuration
# Edit this file to customize your practice exercises

[categories]
# Target minutes per category per day (for progress indicators)
[categories.technique]
name = "Technique"
target_minutes = 15
color = "#28a745"  # Green when complete

[categories.theory]
name = "Knowledge"
target_minutes = 10
color = "#28a745"

[categories.songs]
name = "Songs"
target_minutes = 20
color = "#28a745"

[categories.ear_training]
name = "Ear Training"
target_minutes = 10
color = "#28a745"

[categories.rythm]
name = "Time/Rythm"
target_minutes = 10
color = "#28a745"

[categories.improvisation]
name = "Improvisation"
target_minutes = 20
color = "#28a745"


